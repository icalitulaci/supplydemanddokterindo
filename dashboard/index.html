<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Specialist Demand Map</title>
<script>
  // Apply the saved theme before first paint so the page doesn't flash the wrong colors.
  try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) { /* storage blocked */ }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <!-- Menu and filter bar are built by app.js so they follow the language setting. -->
  <nav class="rail" id="rail" aria-label="Views"></nav>
  <main>
    <form class="filters" id="filters" autocomplete="off"></form>
    <section class="view" id="view-map">
      <div id="map"></div>
      <div class="notice" id="notice" role="note" hidden></div>
      <div class="legend" id="legend"></div>
      <aside class="drawer" id="drawer" hidden></aside>
    </section>
    <section class="view page" id="view-overview" hidden></section>
    <section class="view page" id="view-specialty" hidden></section>
    <section class="view page" id="view-hospital" hidden></section>
    <section class="view page" id="view-region" hidden></section>
    <section class="view page" id="view-quality" hidden></section>
    <section class="view page" id="view-about" hidden></section>
    <section class="view page" id="view-settings" hidden></section>
  </main>
</div>
<div class="loading" id="loading">Loading hospital data… / Memuat data rumah sakit…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
